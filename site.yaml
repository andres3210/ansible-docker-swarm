---
- name: Setup Docker & NFS on CentOS Stream 9
  hosts: all
  become: true
  roles:
    - docker_install
    - mount_nfs

- name: Create the CI deploy user
  hosts: managers
  become: true
  roles:
    - deploy_user

- name: Init Docker Swarm
  hosts: managers[0]
  become: true
  roles:
    - init_docker_swarm

# - name: Join Managers
#   hosts: managers
#   become: true
#   roles:
#     - manager_join_docker_swarm

- name: Join Workers
  hosts: workers
  become: true
  roles:
    - worker_join_docker_swarm

# Traefik first: it creates the traefik_proxy network that Portainer joins.
- name: Deploy Traefik
  hosts: managers[0]
  become: true
  roles:
    - traefik_deploy

- name: Deploy Portainer
  hosts: managers[0]
  become: true
  roles:
    - portainer_deploy
